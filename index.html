<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Creation</title>
    <link href="index.css" rel="stylesheet">
    <!-- TODO as of right now this page allow for modification of only one quiz. 
     Therefore we need to build a page (let's call it A) that will LEAD into this page (B).
     Page A will allow the user to choose which quiz we want to modify/allow the user to create a brand new one  
     this page (B) will be the one we send the user if they decide to create a brand new one.-->
    <!-- This is also only allowing us to BUILD the quiz itself, as for hosting, running the quiz, and exporting it 
      this is still very much a work in progress (can it be called that when we have nothing yet?) -->
</head>

<body>
    <header>
        <h1>Quiz builder </h1>
    </header>
    <aside>
        <div class="quiz_info">
            <p>Title</p>
            <input class="quiz_input" id="quiz-title" placeholder="e.g.Career-Ready quiz"
                value="">
        </div>
        <div class="quiz_info">
            <p>Subtitle / description</p>
            <textarea class="quiz_input" id="quiz-desc"
                placeholder="What is this quiz for?"></textarea>
        </div>
        <div id="block_creation">
            <button class="add_block" onclick="addBlock()">Add a block</button>
        </div>
        <div id="block"></div>


    </aside>
    <script src="index.js"></script>
</body>

</html>
